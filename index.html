
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZIFANG.NET - 正在回归</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #16213e 100%);
      font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(255, 119, 114, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(72, 219, 251, 0.08) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      text-align: center;
      z-index: 1;
      padding: 2rem;
      animation: fadeIn 1.5s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .text {
      font-size: clamp(1.2rem, 4vw, 2.2rem);
      font-weight: 300;
      color: #e8e8e8;
      letter-spacing: 0.15em;
      line-height: 1.8;
      text-shadow:
        0 0 40px rgba(255, 255, 255, 0.1),
        0 0 80px rgba(72, 219, 251, 0.05);
    }

    .highlight {
      color: #48dbfb;
      font-weight: 400;
    }

    .separator {
      color: rgba(255, 255, 255, 0.3);
      margin: 0 0.5em;
    }

    .dots {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #48dbfb;
      border-radius: 50%;
      margin-left: 4px;
      vertical-align: middle;
      animation: pulse 2s ease-in-out infinite;
    }

    .dots::before,
    .dots::after {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      background: rgba(72, 219, 251, 0.5);
      border-radius: 50%;
      margin: 0 4px;
      animation: pulse 2s ease-in-out infinite;
    }

    .dots::after {
      animation-delay: 0.4s;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.4;
        transform: scale(1);
      }
      50% {
        opacity: 1;
        transform: scale(1.2);
      }
    }

    .footnote {
      margin-top: 3rem;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.2);
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="container">
    <p class="text">
      <span class="highlight">10 年没更新的</span>
      <span class="separator">-</span>
      ZIFANG.NET
      <span class="separator">-</span>
      正在回归<span class="dots"></span>
    </p>
    <p class="footnote">Long Time No See!</p>
  </div>

</html>
